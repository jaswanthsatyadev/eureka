version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: eureka-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    env_file:
      - .env
    volumes:
      - ./apps/backend:/app/apps/backend
    restart: unless-stopped
